name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: xaerodeck-app
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp app/build/outputs/apk/debug/app-debug.apk xaerodeck-app.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" xaerodeck-app.apk --clobber
          else
            gh release create "$TAG" --generate-notes xaerodeck-app.apk
          fi
