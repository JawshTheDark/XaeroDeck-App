name: LabelScan

on:
  push:
    paths: ["labelscan/**", ".github/workflows/labelscan.yml"]
    tags: ["labelscan-v*"]
  pull_request:
    paths: ["labelscan/**"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: labelscan

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test and build debug APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: labelscan
          path: labelscan/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp app/build/outputs/apk/debug/app-debug.apk labelscan.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" labelscan.apk --clobber
          else
            gh release create "$TAG" --generate-notes labelscan.apk
          fi
